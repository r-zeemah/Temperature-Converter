<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="tempConvert.css">
    <script src="tempConvert.js" defer></script>
    <title>Temperature</title>
</head>
<body>
    <section>
     <h1>CELSIUS(℃):</h1>
     <input type="number" placeholder="Provide celsius value" id="celsiusInput">

     <h1>FAHRENREIT(℉):</h1>
     <input type="number" placeholder="Provide fahrenheit value"  id="fahrenheitInput">
     <button id="celsiusConverter">Convert ℃ to ℉</button>
     <button id="fahrenheitConverter">Convert ℉ to ℃</button>
     <button id="reset">RESET</button>
    </section>
</body>
</html>
